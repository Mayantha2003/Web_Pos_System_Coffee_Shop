<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAFE 912 — Web POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/styles/style.css">
</head>
<body>
<main>
    <section>
        <div id="topbar">
            <button id="menu-toggle" class="me-2"><i class="bi bi-list"></i></button>
            <div class="d-flex align-items-center gap-2 me-auto">
                <div class="logo-box">
                    <img src="assets/photo/img.png" alt="Logo" class="image">
                </div>
                <div>
                    <span class="logo-name">CAFE 912</span>
                </div>
            </div>
            <div class="d-flex align-items-center gap-2">
                <span class="branch-tag d-none d-sm-inline">Cafe 912 — Colombo · CF912/CMB/01</span>
                <span style="font-size:11px;color:#7a5830;" id="clk"></span>
                <div class="av" id="topbar-av">M</div>
                <button class="topbar-logout d-none d-sm-flex" id="logout-btn">
                    <i class="bi bi-box-arrow-right"></i> <span class="d-none d-md-inline">Sign Out</span>
                </button>
            </div>
        </div>
    </section>
</main>



</body>
</html>
