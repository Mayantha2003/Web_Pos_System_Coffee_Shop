<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAFE 912 — Web POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/styles/style.css">
</head>
<body>
<main>
    <section>
        <div id="topbar">
            <button id="menu-toggle" class="me-2"><i class="bi bi-list"></i></button>
            <div class="d-flex align-items-center gap-2 me-auto">
                <div class="logo-box">
                    <img src="assets/photo/img.png" alt="Logo" class="image">
                </div>
                <div>
                    <span class="logo-name">CAFE 912</span>
                </div>
            </div>
            <div class="d-flex align-items-center gap-2">
                <span class="branch-tag d-none d-sm-inline">Cafe 912 — Colombo · CF912/CMB/01</span>
                <span style="font-size:11px;color:#7a5830;" id="clk"></span>
                <div class="av" id="topbar-av">M</div>
                <button class="topbar-logout d-none d-sm-flex" id="logout-btn">
                    <i class="bi bi-box-arrow-right"></i> <span class="d-none d-md-inline">Sign Out</span>
                </button>
            </div>
        </div>
    </section>
    <section>
        <div class="sb-overlay" id="sb-overlay"></div>
        <nav id="sidebar">
            <div class="sb-section-label">Main</div>
            <button class="nav-item-btn active" data-page="dash"><i class="bi bi-grid-fill"></i> Dashboard</button>
            <button class="nav-item-btn" data-page="sale"><i class="bi bi-cart-fill"></i> Record Sale</button>

            <div class="sb-section-label">Management</div>
            <button class="nav-item-btn" data-page="items"><i class="bi bi-list-ul"></i> Item Management</button>
            <button class="nav-item-btn" data-page="additem"><i class="bi bi-plus-circle"></i> Add Item</button>
            <button class="nav-item-btn" data-page="custs"><i class="bi bi-people-fill"></i> Customer Mgmt</button>
            <button class="nav-item-btn" data-page="addcust"><i class="bi bi-person-plus-fill"></i> Add Customer</button>
            <button class="nav-item-btn" data-page="orders"><i class="bi bi-receipt"></i> Order Management</button>

            <div class="sb-footer">
                <div class="d-flex align-items-center gap-2 mb-2">
                    <div class="mem-av" style="width:30px;height:30px;font-size:12px" id="sb-av">M</div>
                    <div>
                        <div class="sb-footer-name" id="sb-uname">Maya</div>
                        <div class="sb-footer-role" id="sb-urole">Cashier · CF912/CMB/01</div>
                    </div>
                </div>
            </div>
        </nav>
    </section>
</main>



</body>
</html>
